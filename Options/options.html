<!DOCTYPE html> <html lang="zh"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>界面设置 & PiP 站点设置</title> <style>body{font-family:"Segoe UI",sans-serif;display:flex;justify-content:center;align-items:flex-start;margin:0;padding:18px 6px;background:#fafafa}#interfaceForm{background:linear-gradient(135deg,#ffecd2,#fcb69f);border-radius:18px;box-shadow:0 8px 20px rgba(0,0,0,.1);padding:12px 14px;width:980px;transition:transform .3s ease,box-shadow .3s ease}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}h2{text-align:center;color:#ff6f91;font-size:22px;font-weight:700;margin:16px 0 12px}label{display:flex;align-items:center;background-color:#ffe6eb;border-radius:12px;padding:12px;margin:6px 0;font-size:16px;color:#d35b7b;transition:background-color .3s ease,color .3s ease;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.05)}label:hover{background-color:#ffc4d0;color:#ff1f72}input[type=radio]{margin-right:12px;accent-color:#0075FF;width:20px;height:20px}.card{background:#fff;border-radius:14px;border:1px solid rgba(0,0,0,.06);box-shadow:0 6px 16px rgba(0,0,0,.08);padding:14px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}.desc{color:#5b6470;font-size:13px}.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}label.cb{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid #eee;border-radius:10px;cursor:pointer;background:#fff7f9}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{background:#ffe6eb;border:1px solid #ffd0dc;border-radius:999px;padding:6px 10px;font-size:13px;display:inline-flex;gap:8px;align-items:center}.chip button{all:unset;cursor:pointer;opacity:.8}.chip button:hover{opacity:1}input[type=text]{background:#fff;border:1px solid #e7e7e7;color:#222;padding:8px 10px;border-radius:10px;outline:0;width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}button{background:#ff6f91;border:none;color:#fff;padding:8px 12px;border-radius:10px;cursor:pointer;font-size:14px}button.secondary{background:#ffd0dc;color:#a12b4b}.row-inline{display:flex;gap:10px;align-items:center}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px}.toast{position:fixed;right:16px;bottom:16px;background:#0b1220;color:#fff;border:1px solid #2a3448;padding:10px 12px;border-radius:10px;opacity:0;transform:translateY(10px);transition:all .25s}.toast.show{opacity:1;transform:translateY(0)}code{background:#fff2f5;padding:1px 6px;border-radius:6px}</style> <link rel="stylesheet" href="../Shared/module-switcher.css"> </head> <body> <div id="interfaceForm"> <h2>请选择默认界面</h2> <form id="interfaceRadios"> </form> <h2>📺 PiP 画中画站点设置</h2> <div class="card"> <div class="row"> <label class="cb"><input id="enabled" type="checkbox"> 启用 PiP 浮动按钮</label> </div> <div class="desc">对应存储键：<code>pipEnabled</code>。关闭后所有页面都不再显示按钮。</div> </div> <div class="card"> <div class="row"> <label class="cb"><input id="useAllow" type="checkbox"> 仅在选中的网站显示</label> </div> <div class="desc">对应存储键：<code>pipUseAllowList</code>。开启后，只有「站点列表」中勾选的域名才会显示 PiP 按钮。</div> </div> <div class="card"> <h3 style="margin:6px 0 10px;color:#ff6f91">常用站点（快捷勾选）</h3> <div id="siteGrid" class="site-grid"></div> <div class="footer"> <div class="actions"> <button id="selectAll" class="secondary">全选</button> <button id="selectNone" class="secondary">全不选</button> <button id="selectThis">仅本网站</button> </div> <span class="desc">提示：勾选/取消会立刻保存</span> </div> </div> <div class="card"> <h3 style="margin:6px 0 10px;color:#ff6f91">已选站点</h3> <div id="chipList" class="chips"></div> <div class="row row-inline"> <input id="domainInput" type="text" placeholder="例如：Youtube.com 或 Vimeo.com"> <button id="addDomain">添加</button> </div> <div class="desc">删除某个站点：点它右侧的 ×</div> </div> <div class="card"> <h3 style="margin:6px 0 10px;color:#ff6f91">导入 / 导出</h3> <div class="actions"> <button id="exportBtn">导出为 JSON</button> <input id="importFile" type="file" accept=".json" style="display:none"> <button id="importBtn" class="secondary">从 JSON 导入</button> <button id="resetBtn" class="secondary">恢复默认列表</button> </div> <div class="desc" style="margin-top:8px"> 配置与内容脚本实时联动：更改后，当前打开页面的按钮会随 <code>chrome.storage.onChanged</code> 自动同步。 </div> </div> </div> <div id="toast" class="toast">已保存</div> <script src="../Shared/modules.js"></script> <script src="../Shared/storage.js"></script> <script src="options.js"></script> <script src="../Shared/module-switcher.js"></script> </body> </html>
