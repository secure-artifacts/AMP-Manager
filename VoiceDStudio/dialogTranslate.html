<!doctype html> <html lang="zh-CN"> <head> <meta charset="UTF-8"/> <meta name="viewport" content="width=device-width,initial-scale=1"/> <title>实时对话翻译 - VoiceDStudio</title> <link rel="stylesheet" href="dialogTranslate.css"/> </head> <body> <main class="dialogShell"> <header class="hero"> <div> <div class="eyebrow">Live Conversation Translate</div> <h1>实时对话翻译</h1> <p>轻量版手动双按钮模式：先选择语言和麦克风，再点击“我来说”或“对方说”。</p> </div> <span id="liveStatus" class="statusPill">待开始</span> </header> <section class="card"> <div class="sectionTitle"> <span>语言与麦克风</span> <button id="refreshMicBtn" class="mini ghost" type="button">刷新麦克风</button> </div> <div class="grid2"> <label>我说语言 <select id="myLang"> <option value="zh-CN" selected="selected">中文</option> <option value="en">English</option> <option value="ja">日本語</option> <option value="ko">한국어</option> <option value="es">Español</option> <option value="fr">Français</option> </select> </label> <label>对方说语言 <select id="peerLang"> <option value="en" selected="selected">English</option> <option value="zh-CN">中文</option> <option value="ja">日本語</option> <option value="ko">한국어</option> <option value="es">Español</option> <option value="fr">Français</option> </select> </label> <label>我方麦克风 <select id="myMic"> <option value="">默认麦克风</option> </select> </label> <label>对方麦克风 <select id="peerMic"> <option value="">默认麦克风</option> </select> </label> </div> <div class="actionRow"> <button id="permissionBtn" class="primary green" type="button">请求麦克风权限</button> <button id="swapLangBtn" class="secondary" type="button">互换语言</button> <button id="clearLogBtn" class="secondary dangerSoft" type="button">清空记录</button> </div> <div id="micNote" class="note">说明：轻量版 Web Speech API 会保存麦克风选择，但浏览器语音识别通常仍使用系统默认输入。后续专业版会接入指定麦克风 STT。</div> </section> <section class="card talkCard"> <div class="talkButtons"> <button id="meBtn" class="bigBtn me" type="button">🎙 我来说</button> <button id="peerBtn" class="bigBtn peer" type="button">🎙 对方说</button> <button id="stopBtn" class="bigBtn stop" type="button">停止</button> </div> <label>识别原文</label> <textarea id="originalText" placeholder="语音识别到的原文会显示在这里..."></textarea> <label>翻译结果</label> <textarea id="translatedText" placeholder="翻译结果会显示在这里，并自动朗读..."></textarea> <div class="actionRow compact"> <button id="copyBtn" class="secondary" type="button">复制译文</button> <button id="replayBtn" class="secondary blue" type="button">重新朗读</button> <button id="sendBtn" class="secondary green" type="button">发送到通话输入框</button> </div> </section> <section class="card logCard"> <div class="sectionTitle"><span>对话记录</span><span id="logCount" class="count">0 条</span></div> <div id="talkLog" class="talkLog">暂无记录。</div> </section> </main> <script src="dialogTranslate.js"></script> </body> </html>
