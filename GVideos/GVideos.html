<!DOCTYPE html> <html lang="zh"> <head> <meta charset="UTF-8"> <title>Play Video</title> <link rel="icon" type="image/png" href="icons/GVideos16.png"> <style>body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;background-color:#f5f5f9;color:#333;overflow:hidden}.container{display:flex;width:100%;height:100%;border-radius:8px;overflow:hidden;background-color:#fff;position:relative}.sidebar{width:220px;background-color:rgba(10,10,10,.2);color:#fff;padding:2px;box-sizing:border-box;overflow-y:auto;position:absolute;top:0;left:-220px;height:100%;transition:left .3s;z-index:2;backdrop-filter:blur(5px)}.sidebar h3{margin-top:0;font-size:15px;border-bottom:1px solid rgba(189,195,199,.5);padding-bottom:5px}.folder{font-size:13px;color:#fff;font-weight:700;background-color:rgba(0,0,255,.2);padding:5px;border-radius:6px;margin:1px 0}.folder-content{margin-left:2px;padding-left:1px;border-left:2px solid #ddd}.video-title{margin:1px 0;padding:5px;cursor:pointer;border-radius:6px;transition:background-color .3s}.video-title:hover{background:linear-gradient(135deg,rgba(50,180,255,.9),rgba(185,199,235,.9))}.video-container{flex-grow:1;position:relative;background-color:#f9f9f9}iframe{width:100%;height:100%;border:none;border-radius:8px}.trigger-area{position:absolute;top:0;left:0;width:10px;height:100%;z-index:3}#linkEditor{display:none;position:absolute;top:30px;left:10px;background:rgba(255,255,255,.5);padding:10px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.2);backdrop-filter:blur(10px);transition:all .3s}#sheetLink{width:90%;padding:5px 8px;border:1px solid rgba(200,200,200,.7);border-radius:5px;font-size:12px;outline:0;border-color:#66afe9;box-shadow:0 0 8px rgba(102,175,233,.6);margin-bottom:10px}.vLinkButton{width:45%;padding:5px 5px;background:linear-gradient(135deg,#52a5f5,#578ed1);color:#fff;border:none;border-radius:5px;font-size:12px;cursor:pointer;transition:all .3s}#vLinkContainer{display:flex;justify-content:space-between;gap:10px}#searchButton img{transition:transform .3s ease}#searchButton:hover img{transform:scale(1.2)}#searchInput{color:#fff;background-color:rgba(10,10,10,.2);border:1px solid #ccc;outline:0;transition:box-shadow .3s ease}#searchInput:focus{box-shadow:0 0 8px rgba(0,123,255,.5)}</style> <link rel="stylesheet" href="../Shared/module-switcher.css"> </head> <body> <div class="container"> <div class="trigger-area"></div> <div class="sidebar" id="sidebar"> <button id="RefreshButton" style="position:absolute;top:2px;right:35px;background:0 0;border:none;cursor:pointer;font-size:16px"> 🔄 </button> <button id="MuteButton" style="position:absolute;top:5px;right:10px;background:0 0;border:none;cursor:pointer"> <img src="../icons/U-Muted.png" alt="音量图标" style="width:15px;height:15px"> </button> <div id="linkEditor"> <input type="text" id="sheetLink" placeholder="输入新的表格链接"> <div id="vLinkContainer"> <button id="saveVLinkButton" class="vLinkButton">粘贴并保存</button> <button id="openVLinkButton" class="vLinkButton">打开链接</button> </div> </div> <h3 style="margin:0"><a id="LinksetsButton" href="#" style="text-decoration:none;color:#fff">视频列表</a> </h3> <div style="position:relative;margin-bottom:1px"> <button id="searchButton" style="background:0 0;border:none;cursor:pointer;position:absolute;top:-12px;left:60px;transform:translateY(-50%)"> <img src="icons/search-icon.png" alt="搜索图标" style="width:15px;height:15px"> </button> <input type="text" id="searchInput" placeholder="搜索视频..." style="margin-left:1px;display:none;margin-top:1px;width:calc(100% - 35px);padding:5px;font-size:12px;border-radius:5px;border:1px solid #ccc"> </div><style>#searchInput::placeholder{color:#fff}</style> <div id="videoList"></div> </div> <div class="video-container"> <iframe id="videoFrame" allowfullscreen></iframe> </div> </div> <script src="../Shared/modules.js"></script> <script src="../Shared/storage.js"></script> <script src="GVideos.js"></script> <script src="../Shared/module-switcher.js"></script> </body> </html>
