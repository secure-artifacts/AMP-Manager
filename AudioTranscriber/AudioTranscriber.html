<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>双语字幕翻译工具 AudioTranscriber</title> <link rel="icon" type="image/png" href="icons/GTranslate16.png"> <style>:root{--card:rgba(255,255,255,.78);--card2:rgba(255,255,255,.62);--stroke:rgba(0,0,0,.08);--text:#0f172a;--muted:rgba(15, 23, 42, .65);--shadow2:0 10px 26px rgba(0,0,0,.14);--radius:16px;--radius2:12px;--focus:0 0 0 3px rgba(59,130,246,.25);--tcw:100px}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,"Noto Sans","Apple Color Emoji","Segoe UI Emoji";color:var(--text);background:radial-gradient(1200px 600px at 10% 10%,rgba(14,165,233,.45),transparent 60%),radial-gradient(900px 500px at 85% 15%,rgba(139,92,246,.38),transparent 55%),radial-gradient(800px 600px at 60% 95%,rgba(34,197,94,.22),transparent 55%),linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.45))}.app{height:100vh;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 18px 14px}.topbar{width:min(1920px,100%);display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 18px;border-radius:var(--radius);background:var(--card);border:1px solid var(--stroke);box-shadow:var(--shadow2);backdrop-filter:blur(14px)}.top-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}.title{display:flex;flex-direction:column;gap:6px;min-width:0}.title h1{margin:0;font-size:18px;letter-spacing:.2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title p{margin:0;font-size:15px;color:var(--muted);line-height:1.35}.panel{width:min(1920px,100%);display:grid;grid-template-columns:1fr;gap:12px}.card{background:var(--card2);border:1px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow2);backdrop-filter:blur(16px);overflow:hidden}.composer{padding:14px;display:flex;flex-direction:column;gap:12px}textarea{width:100%;min-height:120px;max-height:50vh;resize:vertical;padding:12px 12px;font-size:14px;line-height:1.45;border-radius:var(--radius2);border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.78);outline:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}textarea:focus{box-shadow:var(--focus),inset 0 1px 0 rgba(255,255,255,.6);border-color:rgba(59,130,246,.35)}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}.btns{display:flex;flex-wrap:wrap;gap:10px;align-items:center}button{appearance:none;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.85);color:var(--text);padding:10px 14px;border-radius:999px;font-size:15px;font-weight:650;letter-spacing:.2px;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease,background .12s ease;box-shadow:0 8px 18px rgba(0,0,0,.1)}button:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(0,0,0,.12)}button:active{transform:translateY(0) scale(.99)}button:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}#copyButton,#createDocButton,#generateButton,.btn-primary{background:linear-gradient(135deg,rgba(14,165,233,.95),rgba(139,92,246,.92));color:#fff;border-color:rgba(255,255,255,.18);box-shadow:0 12px 26px rgba(59,130,246,.22)}#copyButton:hover,#createDocButton:hover,#generateButton:hover,.btn-primary:hover{box-shadow:0 14px 30px rgba(59,130,246,.26);transform:translateY(-1px) scale(1.06);filter:brightness(1.03)}.completed{background:linear-gradient(135deg,rgba(34,197,94,.92),rgba(16,185,129,.92));color:#fff;border-color:rgba(255,255,255,.18)}.switch{display:flex;align-items:center;gap:10px;user-select:none;padding:6px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55)}.switch span{font-size:13px;color:var(--muted);font-weight:650}.switch input{display:none}.switch .track{width:44px;height:24px;border-radius:999px;background:rgba(15,23,42,.14);position:relative;transition:background .18s ease;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}.switch .thumb{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.95);position:absolute;top:2px;left:2px;transition:transform .18s ease;box-shadow:0 6px 14px rgba(0,0,0,.18)}.switch input:checked+.track{background:linear-gradient(135deg,rgba(14,165,233,.95),rgba(139,92,246,.92))}.switch input:checked+.track .thumb{transform:translateX(20px)}.table-wrap{height:100%;max-height:calc(100vh - 390px);overflow:auto;padding:10px 12px 12px}.table-wrap::-webkit-scrollbar{width:10px;height:10px}.table-wrap::-webkit-scrollbar-thumb{background:rgba(15,23,42,.18);border-radius:999px;border:3px solid rgba(255,255,255,.65)}.table-wrap::-webkit-scrollbar-track{background:rgba(255,255,255,.35)}table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed;border:1px solid rgba(0,0,0,.12)}#translationTable td.tc,#translationTable th.tc{width:var(--tcw);max-width:var(--tcw);white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;word-break:break-word;line-height:1.2;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;color:rgba(15,23,42,.78)}#translationTable col.tc-col{width:var(--tcw)}#translationTable col.src-col{width:45%}#translationTable col.dst-col{width:55%}#translationTable td.src,#translationTable th.src{width:45%}#translationTable td.dst,#translationTable th.dst{width:55%}body.no-split #translationTable td.tc,body.no-split #translationTable th.tc{display:none}body.no-split #translationTable td.src,body.no-split #translationTable th.src{width:50%}body.no-split #translationTable td.dst,body.no-split #translationTable th.dst{width:50%}body.no-split #translationTable col.tc-col{width:0!important;display:none}body.no-split #translationTable col.src-col{width:50%!important}body.no-split #translationTable col.dst-col{width:50%!important}thead th{position:sticky;top:0;z-index:2;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.12);padding:12px 12px;text-align:left;font-size:12.5px;letter-spacing:.25px;color:rgba(15,23,42,.9)}tbody td{padding:12px 12px;border:1px solid rgba(0,0,0,.12);vertical-align:top;background:rgba(255,255,255,.7)}tbody tr:hover td{background:rgba(255,255,255,.88)}tbody td:focus{outline:0;box-shadow:inset 0 0 0 2px rgba(59,130,246,.18);border-radius:10px}.hint{font-size:15px;color:rgba(15,23,42,.55);padding:10px 15px 0}@media (max-width:720px){.topbar{align-items:flex-start;flex-direction:column}#translationTable td.tc,#translationTable th.tc{width:var(--tcw)}}.wctl{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55)}.wctl .lab{font-size:13px;color:var(--muted);font-weight:650;white-space:nowrap}.wctl input[type=range]{width:160px}.wctl .val{min-width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;color:rgba(15,23,42,.65)}body.no-split .wctl{opacity:.55}.langctl{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55)}.langctl .lab{font-size:13px;color:var(--muted);font-weight:650;white-space:nowrap}.langctl select{appearance:none;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.9);color:rgba(15,23,42,.92);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:650;outline:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer}.langctl select:focus{box-shadow:var(--focus),inset 0 1px 0 rgba(255,255,255,.6);border-color:rgba(59,130,246,.35)}.modectl{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:999px;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.55)}.modectl .lab{font-size:13px;color:var(--muted);font-weight:650;white-space:nowrap}.modectl select{appearance:none;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.9);color:rgba(15,23,42,.92);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:650;outline:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer}.modectl select:focus{box-shadow:var(--focus),inset 0 1px 0 rgba(255,255,255,.6);border-color:rgba(59,130,246,.35)}.lang-tag{margin-left:8px;font-size:12px;font-weight:650;color:rgba(15,23,42,.58);letter-spacing:.1px;white-space:nowrap}.slp-toast{position:fixed;left:50%;top:clamp(72px,300px,calc(100vh - 80px));transform:translate(-50%,-10px);background:linear-gradient(135deg,rgba(251,146,60,.95),rgba(245,158,11,.92),rgba(249,115,22,.92));color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;font-weight:650;letter-spacing:.2px;opacity:0;pointer-events:none;transition:opacity .22s ease,transform .22s ease;z-index:9999;border:1px solid rgba(255,255,255,.22);box-shadow:0 16px 40px rgba(0,0,0,.22);backdrop-filter:blur(10px)}.slp-toast.show{opacity:1;transform:translate(-50%,0)}.slp-toast.info,.slp-toast.success{background:linear-gradient(135deg,rgba(251,146,60,.95),rgba(245,158,11,.92),rgba(249,115,22,.92))}</style> <link rel="stylesheet" href="../Shared/module-switcher.css"> </head> <body> <div class="app"> <div class="topbar"> <div class="title"> <h1>双语字幕翻译工具</h1> <p>粘贴字幕 → 一键生成双语表格。支持“分开时间码”开关，结果可编辑、可复制、可创建 Google 文档。</p> </div> <div class="top-actions"> <div class="modectl" title="选择翻译范围（默认：仅翻译含时间码的内容）"> <div class="lab">翻译范围</div> <select id="translateMode"> <option value="timecode_only" selected="selected">仅翻译时间码内容</option> <option value="all">翻译全部内容</option> </select> </div> <div class="langctl" title="选择翻译的源语言与目标语言（默认：自动识别 → 中文（简体））"> <div class="lab">语言</div> <select id="sourceLang"> <option value="auto">自动识别</option> <option value="zh-CN">中文（简体）</option> <option value="zh-TW">中文（繁体）</option> <option value="en">英语</option> <option value="ja">日语</option> <option value="ko">韩语</option> <option value="es">西班牙语</option> <option value="pt">葡萄牙语</option> <option value="fr">法语</option> <option value="de">德语</option> <option value="it">意大利语</option> <option value="ru">俄语</option> <option value="ar">阿拉伯语</option> <option value="hi">印地语</option> <option value="th">泰语</option> <option value="vi">越南语</option> <option value="id">印尼语</option> <option value="tr">土耳其语</option> <option value="nl">荷兰语</option> <option value="pl">波兰语</option> </select> <span style="opacity:.55;font-weight:700">→</span> <select id="targetLang"> <option value="zh-CN">中文（简体）</option> <option value="zh-TW">中文（繁体）</option> <option value="en">英语</option> <option value="ja">日语</option> <option value="ko">韩语</option> <option value="es">西班牙语</option> <option value="pt">葡萄牙语</option> <option value="fr">法语</option> <option value="de">德语</option> <option value="it">意大利语</option> <option value="ru">俄语</option> <option value="ar">阿拉伯语</option> <option value="hi">印地语</option> <option value="th">泰语</option> <option value="vi">越南语</option> <option value="id">印尼语</option> <option value="tr">土耳其语</option> <option value="nl">荷兰语</option> <option value="pl">波兰语</option> <option value="ms">马来语</option> </select> </div> </div> </div> <div class="panel"> <div class="card composer"> <textarea id="subtitleInput" placeholder="在这里粘贴字幕文本（支持时间码行）…"></textarea> <div class="controls"> <div class="btns"> <button id="generateButton">生成翻译</button> <button id="copyButton">复制翻译</button> <button id="createDocButton">创建Google文档</button> </div> <label class="switch" title="开启：时间码/原文/译文三列；关闭：原文保留时间码，不单独拆列"> <span>分开时间码</span> <input type="checkbox" id="splitTimecodeToggle" checked="checked"> <div class="track" aria-hidden="true"><div class="thumb"></div></div> </label> <div class="wctl" title="调整时间码列宽度（80–600px），默认 100px"> <div class="lab">时间码宽度</div> <input id="tcWidthRange" type="range" min="80" max="600" value="100" step="1"> <div class="val" id="tcWidthLabel">100px</div> </div> </div> </div> <div class="card"> <div class="hint">提示：表格区域可直接编辑；表头会置顶；关闭“分开时间码”后将隐藏时间码列。</div> <div class="table-wrap" contenteditable="true"> <table id="translationTable"> <colgroup> <col class="tc-col"> <col class="src-col"> <col class="dst-col"> </colgroup> <thead> <tr> <th class="tc">时间码</th> <th class="src">原文<span class="lang-tag" id="srcLangTag">自动识别</span></th> <th class="dst">译文<span class="lang-tag" id="dstLangTag">中文（简体）</span></th> </tr> </thead> <tbody> <tr> <td colspan="3">翻译结果将在此处显示...</td> </tr> </tbody> </table> </div> </div> </div> </div> <script src="../Shared/modules.js"></script> <script src="../Shared/storage.js"></script> <script src="AudioTranscriber.js"></script> <script src="../Shared/module-switcher.js"></script> </body> </html>
