"_blank">Google 表格链接（点击打开模板）</a></div></label> <input id="slp-input-sheet" type="url" placeholder="https://docs.google.com/spreadsheets/d/.../edit#gid=0"> <div class="sub">A列：时间码｜B列：原文｜C列：译文｜D列：词级时间（可选）｜E列：✅ 自动发送｜F列：打开链接弹窗</div> </div> <div class="btns"> <span id="slp-msg"></span> <button id="slp-open-sheet" title="打开 Google 表格">打开表格</button> <button id="slp-load">导入字幕</button> <button id="slp-save">保存</button> </div> </div> <div class="slp-section"> <h4>偏好</h4> <div class="slp-row"> <div> <div style="font-size:15px">有 ✅ 时自动发送到 Messenger</div> <div class="sub">发送当前行【原文】（A列去掉时间码）</div> </div> <div class="slp-switch" id="slp-switch-send" role="switch" aria-checked="false"></div> </div> </div> <div class="slp-field"> <label>Instagram Direct 线程 ID</label> <input id="slp-input-threadid" type="text" placeholder="例如：123456789012345"> <div class="sub">目标对话地址类似 https://www.instagram.com/direct/t/<strong>123456789012345</strong></div> </div> <div class="slp-section"> <h4>音频（本地播放列表）</h4> <div class="slp-field"> <label>选择多个 MP3 文件（可多选，追加导入）</label> <input id="slp-input-files" type="file" accept="audio/mpeg,audio/mp3,audio/*" multiple="multiple"> <div class="sub">列表保存文件名和顺序；本地文件需每次打开页面后重新绑定。</div> </div> </div> </div>  <script src="../Shared/vendor/xlsx.full.min.js" defer="defer"></script> <script src="../Shared/modules.js"></script> <script src="../Shared/storage.js"></script> <script src="./AudioLrcPlayer.js" defer="defer"></script> <script src="../Shared/module-switcher.js"></script> </body> </html>
