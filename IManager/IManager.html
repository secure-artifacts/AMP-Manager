<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>GIF Folder Manager</title> <link rel="icon" type="image/png" href="icons/IManager16.png"> <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f0f2f5;display:flex;height:100vh;overflow:hidden}.container{display:flex;width:100%}#gifContainer{flex:3;background-color:#fff;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));grid-auto-rows:100px;gap:15px;overflow-y:auto;border-right:2px solid #ccc;max-height:calc(100vh - 40px)}#gifContainer .gif-item{position:relative}#gifContainer img{width:100%;height:auto;object-fit:cover;border-radius:8px;cursor:pointer;transition:transform .3s ease;box-shadow:0 2px 4px rgba(0,0,0,.1)}#gifContainer img:hover{transform:scale(1.8);z-index:1000;position:relative;box-shadow:0 4px 8px rgba(0,0,0,.3)}#gifContainer .gif-name{position:absolute;bottom:-10px;left:0;width:100%;text-align:center;color:#fff;background-color:rgba(0,0,0,.6);font-size:12px;padding:2px;border-radius:0 0 8px 8px;display:none;transition:visibility .3s ease,opacity .3s ease;opacity:0}#gifContainer .gif-item:hover .gif-name{visibility:visible;opacity:1;z-index:1001}.sidebar{flex:1;background-color:#fff;border-left:2px solid #ddd;padding:20px;overflow-y:auto;max-height:calc(100vh - 40px)}.sidebar h2{text-align:center;margin-bottom:20px;color:#4a4a4a}.folder-card{display:flex;justify-content:space-between;align-items:center;padding:1px;margin-bottom:1px;background-color:#f8f8f8;border-radius:8px;box-shadow:0 2px 4px rgba(0,0,0,.1)}.delete-button,.folder-button{padding:0 2px;border:none;border-radius:6px;cursor:pointer}.folder-button{background-color:#5caf50;color:#fff}.delete-button{background-color:#f12345;color:#fff}input[type=file]{display:block;margin:20px auto;padding:10px;border:2px dashed #888;border-radius:8px;background-color:#fff;width:80%;max-width:300px;text-align:center;cursor:pointer}.blue-btn{background-color:#007bff;color:#fff;border:none;padding:6px 12px;cursor:pointer;font-size:12px;border-radius:4px}</style> <link rel="stylesheet" href="../Shared/module-switcher.css"> </head> <body> <div class="container"> <div id="gifContainer"></div> <div class="sidebar"> <h2>图片列表</h2> <label for="sortSelect">排序方式：</label> <select id="sortSelect"> <option value="name">按名称</option> <option value="size">按大小</option> <option value="type">按类型</option> </select> <input type="file" id="fileInput" webkitdirectory multiple="multiple"> <button id="toggleNamesBtn" class="blue-btn">显示图片名称</button> <div id="folderList"></div> </div> </div> <script src="IManager.js"></script> <script src="../Shared/modules.js"></script> <script src="../Shared/storage.js"></script> <script src="../Shared/module-switcher.js"></script> </body> </html>
