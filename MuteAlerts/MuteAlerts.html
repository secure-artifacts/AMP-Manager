<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>🔕 提示音屏蔽管理</title> <link rel="icon" type="image/png" href="icons/MuteAlerts16.png"> <style>body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f0f1f8;margin:0;padding:0;color:#333;width:390px;height:260px}#app{max-width:390px;margin:0 auto;padding:20px;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.1)}h2{text-align:center;color:#5a90e2}#checkbox24{position:absolute;top:39px;left:280px;transform:scale(1.2);cursor:pointer}textarea{width:100%;padding:12px;border:1px solid #d9e2ec;border-radius:6px;resize:none;font-size:12px;margin-bottom:15px;box-sizing:border-box}textarea:focus{outline:0;border-color:#4a90e2;box-shadow:0 0 4px rgba(74,144,226,.3)}.button-group{display:flex;justify-content:space-between}button{flex:1;margin:0 5px;padding:10px;background-color:#4a90e2;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;transition:background-color .2s}button:hover{background-color:#357abd}button#clear-all{background-color:#d9534f}button#clear-all:hover{background-color:#c9302c}ul{list-style:none;padding:0;margin-top:15px}li{display:flex;align-items:center;justify-content:flex-start;gap:10px;border:1px solid #ccc;margin:1px 0;padding:1px;background:#fff;border-radius:8px;transition:background .2s}li:hover{background:#f9f9f9}.btn-container{display:flex;justify-content:center;align-items:center;width:10px}.btn-remove{display:inline-flex;justify-content:center;align-items:center;width:10px;height:10px;background-color:#d9534f;color:#fff;border:none;border-radius:12px;cursor:pointer;font-size:12px;text-align:center}.btn-remove:hover{background-color:#c9302c}.green-button{display:inline-block;padding:10px 20px;color:#fff;background:linear-gradient(45deg,#4caf50,#388e3c);border:none;border-radius:5px;cursor:pointer;font-weight:700;text-align:center;text-decoration:none;box-shadow:0 4px 6px rgba(0,0,0,.2);transition:background .3s,transform .2s}.green-button:hover{background:linear-gradient(45deg,#66bb6a,#43a047)}li a{display:inline-block;max-width:360px;white-space:nowrap;overflow:hidden;color:#00f;text-decoration:none}.dragging{background:linear-gradient(to right,orange,#ff4500);opacity:.8}</style> <link rel="stylesheet" href="../Shared/module-switcher.css"> </head> <body> <div id="app"> <h2><a href="https://docs.google.com/document/d/1XNhcWp-n5JY2wlNVI9q-tnmUqR7LhkAg0dXXoBWQIxI" target="_blank" style="text-decoration:none;color:inherit">🔕 提示音屏蔽管理</a></h2> <input type="checkbox" id="checkbox24"> <textarea id="url-input" placeholder="输入多个音频链接，每行一个或用逗号、分号分隔" rows="4"></textarea> <div class="button-group"> <button id="add-url">添加</button> <button id="clear-all">清空列表</button> <button id="export-data">导出数据</button> <label for="import-data" class="green-button">导入数据</label> <input type="file" id="import-data" accept=".MuteABak" style="display:none"/> </div> <ul id="url-list"></ul> </div> <script src="../Shared/modules.js"></script> <script src="../Shared/storage.js"></script> <script src="MuteAlerts.js"></script> <script src="../Shared/module-switcher.js"></script> </body> </html>
