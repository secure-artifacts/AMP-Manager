name: Release Browser Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          zip -r "AMP-Manager-${{ github.ref_name }}.zip" . \
            -x '.git/*' '.github/*' 'README.md'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'AMP-Manager-*.zip'

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'AMP-Manager-*.zip'
          generate_release_notes: true
