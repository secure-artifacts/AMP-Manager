<!DOCTYPE html> <html lang="zh-CN"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Messenger To WhatsApp </title> <style>body{font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;padding:20px;background-color:#f5f5f5;width:300px;min-height:250px}h1{font-size:1.2em;color:#333;margin-bottom:15px;text-align:center}.input-container{margin-bottom:15px;width:100%}label{font-size:.9em;color:#333;margin-bottom:5px;display:block}input[type=url]{width:100%;padding:8px;font-size:1em;border:1px solid #ccc;border-radius:4px;box-sizing:border-box}.button-container{display:flex;gap:10px;margin-top:10px}button{padding:10px 20px;font-size:1em;color:#fff;background-color:#0078ff;border:none;border-radius:5px;cursor:pointer;transition:background-color .3s}button:hover{background-color:#005bbb}</style> <link rel="stylesheet" href="../Shared/module-switcher.css"> </head> <body> <h1>Messenger & WhatsApp</h1> <div class="input-container"> <label for="messengerLink">Messenger 链接</label> <input type="url" id="messengerLink" placeholder="输入 Messenger 链接"/> </div> <div class="input-container"> <label for="whatsappLink">WhatsApp 链接</label> <input type="url" id="whatsappLink" placeholder="输入 WhatsApp 链接"/> </div> <div class="button-container"> <button id="openMessenger">打开 Messenger</button> <button id="openWhatsApp">打开 WhatsApp</button> </div> <script src="../Shared/modules.js"></script> <script src="../Shared/storage.js"></script> <script src="MWRelay.js"></script> <script src="../Shared/module-switcher.js"></script> </body> </html>
