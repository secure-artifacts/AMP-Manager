<!doctype html> <html lang="zh-CN"> <head> <meta charset="utf-8"/> <meta name="viewport" content="width=device-width,initial-scale=1"/> <title>GTVideos</title> <style>:root{--bg0:#0b1020;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.10);--stroke:rgba(255,255,255,.14);--stroke2:rgba(255,255,255,.20);--text:rgba(255,255,255,.92);--muted:rgba(255,255,255,.70);--muted2:rgba(255,255,255,.55);--shadow:0 18px 60px rgba(0,0,0,.45);--r:18px;--g1:linear-gradient(135deg, #4f46e5 0%, #3b82f6 45%, #22d3ee 100%);--g2:linear-gradient(135deg, rgba(79,70,229,.24), rgba(59,130,246,.18), rgba(34,211,238,.16))}body,html{height:100%}body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,"PingFang SC","Microsoft YaHei";color:var(--text);background:radial-gradient(1000px 550px at 20% 10%,rgba(79,70,229,.45),transparent 60%),radial-gradient(900px 500px at 85% 20%,rgba(34,211,238,.3),transparent 55%),radial-gradient(900px 650px at 40% 110%,rgba(59,130,246,.25),transparent 65%),var(--bg0)}.wrap{width:420px;padding:14px;box-sizing:border-box}.appHeader{display:flex;align-items:center;gap:12px;padding:12px 12px 10px;border-radius:var(--r);background:var(--g2);border:1px solid var(--stroke);box-shadow:var(--shadow);backdrop-filter:blur(14px)}.logo{width:40px;height:40px;border-radius:14px;background:var(--g1);box-shadow:0 10px 25px rgba(0,0,0,.35);position:relative;overflow:hidden}.logo:after{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.75),transparent 55%);transform:rotate(15deg);opacity:.35}.titleBox{flex:1}.appTitle{font-size:16px;font-weight:800;letter-spacing:.2px}.appSub{margin-top:2px;font-size:12px;color:var(--muted)}.grid{margin-top:12px;display:flex;flex-direction:column;gap:10px}.card{border-radius:var(--r);background:var(--card);border:1px solid var(--stroke);box-shadow:0 14px 45px rgba(0,0,0,.35);backdrop-filter:blur(14px);overflow:hidden}.card .hd{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06)}.card .hd .hTitle{font-weight:800;font-size:13px}.card .bd{padding:12px}.row{display:flex;gap:10px}.row+.row{margin-top:10px}button{appearance:none;border:1px solid var(--stroke2);background:rgba(255,255,255,.08);color:var(--text);border-radius:999px;padding:10px 12px;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.2px;transition:transform .08s ease,background .18s ease,border-color .18s ease;box-shadow:0 10px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex:1;white-space:nowrap}button:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28)}button:active{transform:translateY(1px) scale(.99)}button:focus-visible{outline:0;box-shadow:0 10px 28px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.14),0 0 0 3px rgba(59,130,246,.22)}button.primary{background:var(--g1);border-color:rgba(255,255,255,.22);box-shadow:0 16px 44px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.16)}button.primary:hover{filter:brightness(1.05)}button.ghost{background:rgba(255,255,255,.05);box-shadow:none}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:10px}code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;color:rgba(255,255,255,.92);background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.12);padding:2px 6px;border-radius:10px}.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.18);font-size:12px;color:var(--muted)}textarea{width:100%;box-sizing:border-box;min-height:170px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.25);color:rgba(255,255,255,.92);padding:12px 12px;resize:vertical;outline:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55}textarea:focus{border-color:rgba(34,211,238,.55);box-shadow:0 0 0 4px rgba(34,211,238,.14)}.optLine{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.optLabel{font-size:12px;color:var(--muted)}.switch{display:inline-flex;align-items:center;gap:10px;user-select:none;font-size:12px;color:var(--muted)}.switch input{display:none}.track{width:46px;height:26px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);position:relative;transition:all .18s ease}.dot{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:0 6px 16px rgba(0,0,0,.35);transition:all .18s ease}.switch input:checked+.track{background:rgba(79,70,229,.35);border-color:rgba(34,211,238,.45)}.switch input:checked+.track .dot{left:23px;background:#fff}.keys{margin:0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.7}.keys b{color:rgba(255,255,255,.92);font-family:ui-monospace,Menlo,monospace}.footNote{margin-top:10px;font-size:11px;color:var(--muted2)}.card .hd{display:none}#btnInsertEnd,#btnInsertStart,#btnLoad,#btnSave{background:linear-gradient(135deg,rgba(79,70,229,.85),rgba(59,130,246,.82),rgba(34,211,238,.68));border-color:rgba(255,255,255,.24)}#btnInsertEnd:hover,#btnInsertStart:hover,#btnLoad:hover,#btnSave:hover{filter:brightness(1.05)}</style> <link rel="stylesheet" href="../Shared/module-switcher.css"> </head> <body> <div class="wrap"> <div class="appHeader"> <div class="logo" aria-hidden="true"></div> <div class="titleBox"> <div class="appTitle">GTVideos 分段播放器</div> <div class="appSub">YouTube / 本地网页 · 章节导入 · 勾选队列播放 · 段末暂停</div> </div> </div> <div class="grid"> <div class="card"> <div class="bd"> <div class="row"> <button id="btnImportYT" class="primary">🧩 导入 YouTube 章节/描述</button> </div> <div class="footNote">提示：点击扩展图标显示/隐藏「左编辑器 + 右播放面板」。</div> </div> </div> <div class="card"> <div class="hd"> <div class="hTitle">分段输入</div> <div class="optLabel">每行一段</div> </div> <div class="bd"> <div class="hint"> 推荐格式：<code>✅⏸️ 00:10-00:25 Intro</code><br/> 也兼容旧格式：<code>[x][p] 00:10-00:25 Intro</code> <div class="badges"> <span class="pill">✅ 参与自动播放</span> <span class="pill">⏸️ 播完该段暂停</span> <span class="pill">时间码支持：MM:SS / HH:MM:SS</span> </div> </div> <textarea id="segmentsText" rows="9" placeholder="✅⏸️ 00:10-00:25 Intro
✅ 00:25-00:55 Verse
✅ 00:55-01:20 Chorus"></textarea> <div class="row" style="margin-top:10px"> <button id="btnInsertStart" class="ghost">⏱️ 插入开始时间</button> <button id="btnInsertEnd" class="ghost">⏱️ 插入结束时间</button> </div> <div class="optLine"> <span class="optLabel">读取当前页分段</span> <label class="switch" title="打开控制页时自动读取并填充分段"> <input id="chkAutoLoadSegments" type="checkbox"/> <span class="track"><span class="dot"></span></span> <span>自动读取</span> </label> </div> <div class="row" style="margin-top:12px"> <button id="btnLoad" class="ghost">📥 读取当前页分段</button> <button id="btnSave" class="primary">💾 保存到当前页</button> </div> </div> </div> <div class="card"> <div class="hd"><div class="hTitle">快捷键（在页面内）</div></div> <div class="bd"> <ul class="keys"> <li><b>\</b> 显示/隐藏面板</li> <li><b>[</b> 上一段，<b>]</b> 下一段</li> <li><b>L</b> 循环开关（最高优先级）</li> <li><b>A</b> 自动播开关（只播勾选段）</li> <li><b>P</b> 段末停开关（全局）</li> </ul> </div> </div> </div> </div> <script src="../Shared/modules.js"></script> <script src="../Shared/storage.js"></script> <script src="GTVideos.js"></script> <script src="../Shared/module-switcher.js"></script> </body> </html>
